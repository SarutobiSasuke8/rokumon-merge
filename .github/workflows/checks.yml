name: Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests (rules, saves, property test)
        run: npm test
      - name: Install Chromium for the smoke test
        run: npx playwright install --with-deps chromium
      - name: Browser smoke test
        run: npm run smoke
